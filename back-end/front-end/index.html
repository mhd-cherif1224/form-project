<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Form</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body>
<header class="header">

    <h2>Gestion des Clients</h2>

    <div id="notifBell" class="notif-bell">
        <ion-icon name="notifications-outline"></ion-icon>
        <span id="notifBadge" class="notif-badge hidden">0</span>
    </div>

    <div id="notifDropdown" class="notif-dropdown hidden">
        <h4>Rappels — réservations demain</h4>
        <div id="notifList"></div>
    </div>

    <input
    type="text"
    id="searchInput"
    placeholder="Rechercher un client..."
    >
    <nav>
        <button class="tab active" id="addTab">
            <ion-icon name="person-add-outline"></ion-icon>
            Nouveau Client
        </button>
        <button class="tab" id="listTab">
            <ion-icon name="list-outline"></ion-icon>
            Liste des Clients
        </button>
    </nav>

</header>
<section id="addClientSection">
<div class="container">

    <h1>Nouveau Client</h1>

    <form id="clientForm">

        <!-- Nom -->
        <div class="group">
            <label for="nom">Nom *</label>
            <input
                type="text"
                id="nom"
                name="nom"
                placeholder="Nom"
                required>
        </div>

        <!-- Prénom -->
        <div class="group">
            <label for="prenom">Prénom *</label>
            <input
                type="text"
                id="prenom"
                name="prenom"
                placeholder="Prénom"
                required>
        </div>
        <div class="group">
    <label for="fonctionne">Fonctionne</label>
        <input
            type="text"
            id="fonctionne"
            name="fonctionne"
        >
    </div>

        <h3><ion-icon name="share-social-outline"></ion-icon> Moyens de contact</h3>

        <div class="checks">

            <!-- Numéro -->
            <label>
                <input
                    type="checkbox"
                    id="phoneCheck">
                <ion-icon name="call-outline"></ion-icon>
                Numéro
            </label>

            <div id="phoneField" class="hidden">
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="+213560123456"
                    pattern="^\+?[0-9]{6,15}$">
            </div>

            <!-- WhatsApp -->
            <label>
                <input
                    type="checkbox"
                    id="whatsappCheck">
                <ion-icon name="logo-whatsapp"></ion-icon>
                WhatsApp
            </label>

            <div id="whatsappField" class="hidden">
                <input
                    type="tel"
                    id="whatsapp"
                    name="whatsapp"
                    placeholder="+213560123456"
                    pattern="^\+?[0-9]{6,15}$">
            </div>

            <!-- Facebook -->
            <label>
                <input
                    type="checkbox"
                    id="facebookCheck">
                <ion-icon name="logo-facebook"></ion-icon>
                Facebook
            </label>

            <div id="facebookField" class="hidden">
                <input
                    type="text"
                    id="facebook"
                    name="facebook"
                    placeholder="Nom Facebook">
            </div>

            <!-- Instagram -->
            <label>
                <input
                    type="checkbox"
                    id="instagramCheck">
                <ion-icon name="logo-instagram"></ion-icon>
                Instagram
            </label>

            <div id="instagramField" class="hidden">
                <input
                    type="text"
                    id="instagram"
                    name="instagram"
                    placeholder="Nom Instagram">
            </div>

            <!-- Snapchat -->
            <label>
                <input
                    type="checkbox"
                    id="snapCheck">
                <ion-icon name="logo-snapchat"></ion-icon>
                Snapchat
            </label>

            <div id="snapField" class="hidden">
                <input
                    type="text"
                    id="snapchat"
                    name="snapchat"
                    placeholder="Nom Snapchat">
            </div>

            <label>
                <input
                    type="checkbox"
                    id="tiktokCheck">
                <ion-icon name="logo-tiktok"></ion-icon>
                TikTok
            </label>

            <div id="tiktokField" class="hidden">
                <input
                    type="text"
                    id="tiktok"
                    name="tiktok"
                    placeholder="Nom TikTok">
            </div>

        </div>

        <!-- reservation de quelque chose -->

        <div class="group">
            <label>
                <input
                    type="checkbox"
                    id="reservCheck">
                <ion-icon name="calendar-outline"></ion-icon>
                <h3>Réservation</h3>
            </label>

            <div id="reservationFields" class="hidden">
                <input
                    type="text"
                    id="reservDeQuoi"
                    name="reservation_de_quoi"
                    placeholder="Billet d'avion, hôtel, etc.">

                <input
                    type="date"
                    id="reservQuand"
                    name="reservation_date">
            </div>
        </div>
        <!-- Description -->
        <div class="group">
            <label for="description">Description *</label>
            <textarea
                id="description"
                name="description"
                rows="5"
                placeholder="Ajouter une description..."
                required></textarea>
        </div>

        <!-- Travail -->
        <div class="group">
            <label for="travail">Travail *</label>

            <select
                id="travail"
                name="travail"
                required>

                <option value="" selected disabled>
                    Choisir...
                </option>

                <option value="en_cours">
                    En cours
                </option>

                <option value="fini">
                    Fini
                </option>

            </select>
        </div>

        <!-- Assignation -->
        <div class="group">

            <label>Assigné à *</label>

            <div class="workers">

                <input
                    type="radio"
                    id="faycal"
                    name="worker"
                    value="Faycal Mancer"
                    required>

                <label
                    for="faycal"
                    class="worker-btn">
                    Faycal Mancer
                </label>


                <input
                    type="radio"
                    id="zakari"
                    name="worker"
                    value="Aouchiche Zakari">

                <label
                    for="zakari"
                    class="worker-btn">
                    Aouchiche Zakari
                </label>


                <input
                    type="radio"
                    id="reda"
                    name="worker"
                    value="Sadaoui Reda">

                <label
                    for="reda"
                    class="worker-btn">
                    Sadaoui Reda 
                </label>

                <input
                    type="radio"
                    id="newworker"
                    name="worker"
                    value="Riyad Mancer">

                <label
                    for="newworker"
                    class="worker-btn">
                    Riyad Mancer
                </label>

            </div>

        </div>

        <button type="submit">
            <ion-icon name="save-outline"></ion-icon>
            Enregistrer
        </button>

</div>

    </form>

    <button id="floatingReminderBtn" class="floating-reminder-btn">
        <ion-icon name="alarm-outline"></ion-icon>
    </button>

    <div id="reminderModal" class="modal hidden">
    <div class="modal-content">

        <h3>Programmer un rappel</h3>

        <input type="datetime-local" id="reminderDateTime">

        <div class="modal-actions">
            <button type="button" id="cancelReminderBtn">Annuler</button>
            <button type="button" id="saveReminderBtn">Enregistrer</button>
        </div>

    </div>
</div>
</div>
</section>
<section id="listClientSection" class="hidden">

    <h2><ion-icon name="people-outline"></ion-icon> Liste des Clients</h2>

    <div class="table-wrapper">
        
    <table id="clientsTable">

        <thead>

            <tr>

                <th>Nom</th>
                <th>Prénom</th>
                <th>Fonctionne</th>
                <th>Téléphone</th>
                <th>WhatsApp</th>
                <th>Facebook</th>
                <th>Instagram</th>
                <th>Snapchat</th>
                <th>TikTok</th>
                <th>Reservation</th>
                <th>Reservation de quoi</th>
                <th>Reservation quand</th>
                <th>Travail</th>
                <th>Assigné à</th>
                <th>Rappel</th>

            </tr>

        </thead>

        <tbody id="clientsTableBody">

        </tbody>

    </table>
</div>

    <!-- Pagination controls -->
    <div id="paginationControls"></div>

</section>

<script src="script.js"></script>
<script src="scriptStyle.js"></script>

</body>
</html>
